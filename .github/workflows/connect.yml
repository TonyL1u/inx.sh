name: connect

# Publishes the INX Connect controller image (control API + console) to Docker Hub as inxsh/inx-connect.
# Push a tag connect-v<version> matching packages/inx-control-api/package.json (pnpm --filter @inx.sh/control-api release).
# No GitHub Release is created: Releases in this repository belong to the Gateway, so /releases/latest stays a Gateway.
on:
  push:
    tags:
      - 'connect-v[0-9]+.[0-9]+.[0-9]+'
      - 'connect-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:

env:
  IMAGE: inxsh/inx-connect

jobs:
  image:
    runs-on: ubuntu-24.04
    environment: inx.sh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve version and image tags
        id: meta
        run: |
          version=$(node -p "require('./packages/inx-control-api/package.json').version")
          num='(0|[1-9][0-9]*)'
          [[ $version =~ ^$num\.$num\.$num(-beta\.$num)?$ ]] || { echo "Invalid control API version $version" >&2; exit 1; }
          if [[ "${{ github.event_name }}" == push && "${{ github.ref_name }}" != "connect-v$version" ]]; then
            echo "Tag ${{ github.ref_name }} does not match connect-v$version" >&2; exit 1
          fi
          if [[ $version == *-* ]]; then tags="$IMAGE:$version,$IMAGE:beta"
          else tags="$IMAGE:$version,$IMAGE:${version%.*},$IMAGE:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image tags: $tags"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inx.sh/console --filter @inx.sh/control-api typecheck
      - run: pnpm --filter @inx.sh/console --filter @inx.sh/control-api lint
      - run: pnpm --filter @inx.sh/control-api test
      - run: pnpm --filter @inx.sh/console build
      - run: pnpm --filter @inx.sh/control-api build
      - name: Check the console is bundled
        run: test -f packages/inx-control-api/dist/public/index.html
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/inx-control-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=INX Connect
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
